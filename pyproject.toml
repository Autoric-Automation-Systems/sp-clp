[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sp-clp"
version = "0.1.0"
description = "Dashboard local para monitoramento de CLPs Siemens S7-1200"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "python-snap7>=2.0,<3.0",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1.0", "pytest>=8.0,<9.0"]
build = ["pyinstaller>=6.10,<7.0"]

[project.scripts]
sp-clp = "app.main:run"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
